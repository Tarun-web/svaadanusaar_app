<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diet App - Razorpay Test</title>
</head>

<body>

<h2>Diet App - Razorpay Test Payment</h2>

<p>Plan: 1 Month</p>
<p>Amount: ₹499</p>

<button id="payButton">
    Pay ₹499
</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

    // NEW Razorpay subscription created by /api/v1/payments/create
    const subscriptionId = "sub_TcaeqH0iMtnWp4";

    const options = {

        key: "rzp_test_T57g4rbnzF38Zh",

        subscription_id: subscriptionId,

        name: "Diet App",

        description: "1 Month Subscription",

        handler: async function (response) {

            console.log("Payment successful!");
            console.log("Payment ID:", response.razorpay_payment_id);
            console.log("Subscription ID:", response.razorpay_subscription_id);
            console.log("Signature:", response.razorpay_signature);

            try {

                // Ask for JWT because /verify requires authentication
                const token = prompt("Enter your JWT token:");

                const verifyResponse = await fetch(
                    "http://localhost:8085/api/v1/payments/verify",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },

                        body: JSON.stringify({
                            razorpayOrderId: null,
                            razorpaySubscriptionId:
                            response.razorpay_subscription_id,
                            razorpayPaymentId:
                            response.razorpay_payment_id,
                            razorpaySignature:
                            response.razorpay_signature
                        })
                    }
                );

                const result = await verifyResponse.text();

                console.log("Verify status:", verifyResponse.status);
                console.log("Verify response:", result);

                if (verifyResponse.ok) {

                    alert(
                        "Payment successful and verified!\n\n" +
                        "Payment ID: " +
                        response.razorpay_payment_id
                    );

                } else {

                    alert(
                        "Payment succeeded at Razorpay,\n" +
                        "but verification failed.\n\n" +
                        result
                    );
                }

            } catch (error) {

                console.error("Verification error:", error);

                alert(
                    "Payment succeeded at Razorpay,\n" +
                    "but verification request failed."
                );
            }
        },

        prefill: {
            name: "Test User",
            email: "test@example.com",
            contact: "9999999999"
        },

        theme: {
            color: "#3399cc"
        }
    };


    const razorpay = new Razorpay(options);


    razorpay.on("payment.failed", function (response) {

        console.error("Payment failed:", response.error);

        alert(
            "Payment failed:\n\n" +
            response.error.description
        );
    });


    document.getElementById("payButton").onclick = function (e) {

        razorpay.open();

        e.preventDefault();
    };

</script>

</body>
</html>
